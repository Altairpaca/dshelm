packages:
  - packages/*
# pnpm 11 settings live here (the package.json "pnpm" field is no longer read).
# pnpm 11's build-approval gate is the allowBuilds map (written by
# `pnpm approve-builds`); the legacy onlyBuiltDependencies list is ignored.
allowBuilds:
  esbuild: false
  '@google/genai': true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.0-rc.7'
  - '@deepseek-ai/dsh-agent-loop@0.1.0-rc.7'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.7'
