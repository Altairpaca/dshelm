name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  community-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-community-docs.mjs

  core-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/core/tests/config-loader.test.ts packages/core/tests/config-validation.test.ts packages/core/tests/policy-errors.test.ts packages/core/tests/policy-resolver.test.ts

  core-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/core/tests/core-property.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dsh-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # keyless real-execution + host composition + vertical slice (hermetic)
      - run: pnpm vitest run packages/dsh/tests/dsh-request-contract.test.ts packages/dsh/tests/host-composition.test.ts packages/dsh/tests/vertical-slice.test.ts packages/dsh/tests/keyless-vertical-slice.test.ts

  v03-auth-knowledge-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run packages/auth/tests/auth.test.ts packages/model-knowledge/tests/knowledge.test.ts packages/cli/tests/user-commands.test.ts packages/dsh/tests/knowledge-overlay.test.ts
      - run: pnpm --filter dshelm typecheck

  pack-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          mkdir -p /tmp/pack /tmp/fresh
          pnpm --filter @dshelm/core pack --pack-destination /tmp/pack >/dev/null
          pnpm --filter @dshelm/dsh pack --pack-destination /tmp/pack >/dev/null
          pnpm --filter @dshelm/auth pack --pack-destination /tmp/pack >/dev/null
          pnpm --filter @dshelm/model-knowledge pack --pack-destination /tmp/pack >/dev/null
          pnpm --filter @dshelm/compat-omo pack --pack-destination /tmp/pack >/dev/null
          pnpm --filter dshelm pack --pack-destination /tmp/pack >/dev/null
          mkdir -p /tmp/dsh-cli
          npm install --prefix /tmp/dsh-cli --no-audit --no-fund @deepseek-ai/dsh@0.1.0-rc.7 >/dev/null
          cd /tmp/fresh
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/pack/dshelm-core-*.tgz /tmp/pack/dshelm-dsh-*.tgz /tmp/pack/dshelm-auth-*.tgz /tmp/pack/dshelm-model-knowledge-*.tgz /tmp/pack/dshelm-compat-omo-*.tgz /tmp/pack/dshelm-0.3.0-alpha.0.tgz >/dev/null
          node -e "import('@dshelm/core').then(m => { if (!m.resolvePolicy) process.exit(1) })"
          node -e "import('@dshelm/dsh').then(m => { if (!m.DSHelmPolicyService) process.exit(1) })"
          node -e "if (!require.resolve('dshelm').endsWith('/dist/index.js')) process.exit(1)"
          bash "$GITHUB_WORKSPACE/scripts/qa-clean-install.sh" \
            /tmp/fresh/node_modules/dshelm/dist/index.js \
            /tmp/pack/dshelm-core-*.tgz \
            /tmp/pack/dshelm-model-knowledge-*.tgz \
            /tmp/pack/dshelm-dsh-*.tgz \
            /tmp/dsh-cli/node_modules/.bin/dsh
          node "$GITHUB_WORKSPACE/scripts/verify-client-bundle.js"

  # Optional upstream source lane: explicit DSH_REFERENCE_DIR, never a
  # default hermetic dependency.
  dsh-upstream-source-contract:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: echo 'dsh-upstream-source-contract is informational; requires DSH_REFERENCE_DIR checkout'
