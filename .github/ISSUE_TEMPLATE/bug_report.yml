name: 缺陷报告 / Bug report
description: 报告可复现的 DSHelm 错误或意外行为，中英文均可
title: "[缺陷]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢帮助改进 DSHelm。请提供最小复现，并删除凭据、token、cookie 和私人路径。English reports are welcome.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      placeholder: e.g. 0.0.x
  - type: input
    id: dshelm-version
    attributes:
      label: DSHelm 版本 / commit
      placeholder: e.g. main@abcdef
  - type: textarea
    id: description
    attributes:
      label: 发生了什么？
      description: 描述实际行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 提供可以复现问题的最小配置和操作步骤。
  - type: textarea
    id: resolution
    attributes:
      label: Resolution Trace / 日志
      description: 如果可以，请粘贴脱敏后的 Resolution Trace 或相关日志。
